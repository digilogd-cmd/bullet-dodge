name: Sommers iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sommers-ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.sommers.app
  PROFILE_NAME: AppStore com.sommers.app

jobs:
  build-sommers-ios:
    name: Build Sommers and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Sommers source
        uses: actions/checkout@v4
        with:
          repository: digilogd-cmd/sommers-app
          ref: ios-app-store
          token: ${{ secrets.SOMMERS_APP_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies, build web, sync iOS
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx cap sync ios

      - name: Verify web bundle is usable in the webview
        run: |
          set -euo pipefail
          WEB="ios/App/App/public"
          test -f "$WEB/index.html"

          # A GitHub Pages basePath makes every asset 404 inside the Capacitor
          # webview, which ships as a blank screen. Build 7 was rejected for this.
          if grep -q '/Somers-Live-Translator/' "$WEB/index.html"; then
            echo "::error::index.html still carries the GitHub Pages basePath — the app would launch blank."
            exit 1
          fi

          # Client config is compiled in at build time; without it Firebase Auth
          # cannot initialise and the interpreter cannot reach the backend.
          grep -rq 'sommers-327af' "$WEB/_next" || {
            echo "::error::Firebase config missing from the bundle — login would fail."
            exit 1
          }
          grep -rq 'sommers-backend' "$WEB/_next" || {
            echo "::error::Backend WebSocket URL missing from the bundle — interpretation would fail."
            exit 1
          }
          echo "Web bundle verified: no basePath, Firebase and backend config present."

      - name: Bump build number
        run: |
          set -euo pipefail
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Install pods
        # The project migrated from SPM to CocoaPods because
        # @codetrix-studio/capacitor-google-auth ships only a podspec — under
        # SPM its native code silently never compiled, which is why every
        # device build reported '"GoogleAuth" plugin is not implemented on ios'.
        run: |
          set -euo pipefail
          cd ios/App
          pod install

      - name: Register native config files in the Xcode project
        run: |
          set -euo pipefail
          cd ios/App

          # `cap add ios` never registered GoogleService-Info.plist with the Xcode
          # project, so it was absent from the bundle and Firebase/Google Sign-In
          # could not initialise natively. Register it and copy it as a resource.
          # Done once here so both the simulator smoke test and the signed archive
          # pick it up.
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |item| item.name == 'App' }
          abort('App target not found') unless target

          plist_name = 'GoogleService-Info.plist'
          app_group = project.main_group['App'] || project.main_group
          plist_ref = app_group.files.find { |file| file.display_name == plist_name }
          plist_ref ||= app_group.new_reference(plist_name)
          resources = target.resources_build_phase
          unless resources.files_references.include?(plist_ref)
            resources.add_file_reference(plist_ref)
          end

          # Same problem, different phase: dropping a new .swift file into
          # ios/App/App/ does not add it to the Xcode project -- Xcode only
          # compiles files explicitly listed in the target's Sources build
          # phase, it does not scan the directory. Build 25 shipped with
          # DeviceTrialPlugin.swift present on disk but absent from the binary
          # (confirmed via `strings` on the archived IPA) for exactly this
          # reason. Register every .swift file in App/ that isn't already a
          # member of the Sources phase, so any future native plugin file
          # added the same way doesn't silently go missing again.
          sources = target.source_build_phase
          Dir.glob('App/*.swift').each do |path|
            file_name = File.basename(path)
            file_ref = app_group.files.find { |file| file.display_name == file_name }
            file_ref ||= app_group.new_reference(file_name)
            unless sources.files_references.include?(file_ref)
              sources.add_file_reference(file_ref)
            end
          end

          # Sign In with Apple was only ever enabled on the App ID in the Apple
          # Developer portal -- the Xcode project itself never declared the
          # matching entitlement, so ASAuthorizationAppleIDProvider always failed
          # on device (no .entitlements file, no CODE_SIGN_ENTITLEMENTS build
          # setting existed anywhere in this project). App.entitlements now exists
          # in the repo; wire it in here so every build actually signs with it.
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          project.save
          RUBY

      - name: Smoke test in iOS Simulator (advisory — does not block the build)
        # This step's pass/fail has proven unreliable: identical builds have shown
        # a blank screen, a home-screen bounce, and a clean pass across consecutive
        # runs, while the unified system log confirms the app itself loads and
        # renders without crashing every time. That's Simulator/CI launch-timing
        # flakiness, not a real app defect -- gating TestFlight uploads on it blocks
        # good builds. Keep it for its screenshot/log diagnostics, but don't fail
        # the job over it; real launch-crash protection now lives in the archive
        # verification step below (native config file checks) and in removing
        # AdMob's native init call from iOS entirely.
        continue-on-error: true
        run: |
          set -euo pipefail
          cd ios/App

          SIM_LINE=$(xcrun simctl list devices available | grep -m1 'iPhone')
          SIM_UDID=$(echo "$SIM_LINE" | grep -oE '[0-9A-Fa-f-]{36}')
          test -n "$SIM_UDID"
          echo "Using simulator: $SIM_LINE"

          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/sim-build" \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find "$RUNNER_TEMP/sim-build/Build/Products" -iname "App.app" -type d | head -1)
          test -n "$APP_PATH" || {
            echo "::error::Could not find built App.app under $RUNNER_TEMP/sim-build/Build/Products"
            find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2
            exit 1
          }
          echo "Found app at: $APP_PATH"

          # Package the Simulator build so it can be downloaded and dragged onto a
          # booted Simulator window -- no Xcode project, Node, or CLI tooling needed
          # on the receiving Mac, just Xcode + Simulator.app installed.
          mkdir -p "$RUNNER_TEMP/sim-output"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/sim-output/Sommers-Simulator.app.zip"

          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"

          # Poll for up to 30s instead of a single point-in-time check — a cold
          # launch on a CI simulator (fresh boot, no disk cache) can legitimately
          # take longer than a quick crash would.
          ALIVE=false
          for i in $(seq 1 15); do
            sleep 2
            if xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q "$BUNDLE_ID"; then
              ALIVE=true
              break
            fi
          done

          mkdir -p "$RUNNER_TEMP/sim-output"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/sim-output/launch-screenshot.png"

          if [ "$ALIVE" = "true" ]; then
            echo "Simulator smoke test passed: app was running within 30s of launch."
          else
            echo "::warning::App did not appear in launchctl within 30s of launch — checking for a crash report."
            CRASH_LOG=$(find "$HOME/Library/Logs/DiagnosticReports" -iname "App-*" -newermt '-2 minutes' 2>/dev/null | head -1)
            if [ -n "$CRASH_LOG" ]; then
              echo "::error::App crashed on launch. Crash report follows ($CRASH_LOG):"
              cat "$CRASH_LOG"
            else
              echo "::error::App is not running and no crash report was found (may be hung, not crashed)."
              echo "--- recent system log for the app process ---"
              xcrun simctl spawn "$SIM_UDID" log show --last 2m --predicate "process == \"App\"" 2>&1 | tail -n 200 || true
            fi
            exit 1
          fi

          xcrun simctl shutdown "$SIM_UDID" || true

      - name: Save simulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sommers-Simulator-Launch-${{ github.run_number }}
          path: ${{ runner.temp }}/sim-output/launch-screenshot.png
          if-no-files-found: warn
          retention-days: 14

      - name: Save Simulator app build (drag onto a booted Simulator to install)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sommers-Simulator-App-${{ github.run_number }}
          path: ${{ runner.temp }}/sim-output/Sommers-Simulator.app.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare App Store Connect key and Sommers profile
        env:
          API_KEY_VALUE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_VALUE"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          if printf '%s' "$API_KEY_VALUE" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_VALUE" > "$API_KEY_PATH"
          else
            printf '%s' "$API_KEY_VALUE" | tr -d '\n\r ' | base64 --decode > "$API_KEY_PATH"
          fi

          git clone --depth 1 https://github.com/Apple-Actions/download-provisioning-profiles.git "$RUNNER_TEMP/apple-profiles"
          "$RUNNER_TEMP/apple-profiles/scripts/create-provisioning-profile.sh" \
            --bundle-id "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --name "$PROFILE_NAME" \
            --issuer-id "$API_ISSUER_ID" \
            --api-key-id "$API_KEY_ID" \
            --api-private-key-path "$API_KEY_PATH"

          source "$RUNNER_TEMP/apple-profiles/scripts/lib/asc.sh"
          ASC_ISSUER_ID="$API_ISSUER_ID"
          ASC_KEY_ID="$API_KEY_ID"
          ASC_PRIVATE_KEY_PATH="$API_KEY_PATH"
          asc_load_credentials
          ENCODED_NAME=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$PROFILE_NAME")
          asc_api_get "/v1/profiles?filter[name]=${ENCODED_NAME}&filter[profileType]=IOS_APP_STORE&limit=20"
          PROFILE_ID=$(printf '%s' "$ASC_API_BODY" | jq -r '[.data[] | select(.attributes.profileState == "ACTIVE")][0].id')
          test -n "$PROFILE_ID"
          test "$PROFILE_ID" != "null"
          asc_api_get "/v1/profiles/${PROFILE_ID}"
          printf '%s' "$ASC_API_BODY" | jq -r '.data.attributes.profileContent' | base64 --decode > "$RUNNER_TEMP/sommers.mobileprovision"
          test -s "$RUNNER_TEMP/sommers.mobileprovision"

      - name: Install distribution certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temp_pwd}"
          KEYCHAIN_PATH="$RUNNER_TEMP/sommers-signing.keychain-db"
          RAW_CERT="$RUNNER_TEMP/raw-cert.p12"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          printf '%s' "$CERTIFICATE_BASE64" | tr -d '\n\r\t ' | base64 --decode > "$RAW_CERT"
          if openssl pkcs12 -in "$RAW_CERT" -out "$RUNNER_TEMP/cert.pem" -nodes -passin pass:1234 2>/dev/null; then
            true
          else
            openssl pkcs12 -in "$RAW_CERT" -out "$RUNNER_TEMP/cert.pem" -nodes -passin pass:"$P12_PASSWORD"
          fi
          if openssl pkcs12 -help 2>&1 | grep -q '\-legacy'; then
            LEGACY_FLAG='-legacy'
          else
            LEGACY_FLAG=''
          fi
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$CERT_PATH" -password pass:1234 $LEGACY_FLAG
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P 1234 -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/sommers.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/sommers.mobileprovision"

      - name: Archive and export
        run: |
          set -euo pipefail
          cd ios/App
          security cms -D -i "$RUNNER_TEMP/sommers.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          export TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")

          # Apply manual distribution signing only to the native App target.
          # Command-line signing overrides are intentionally avoided because
          # they also propagate to unsigned SPM resource bundle targets.
          # (GoogleService-Info.plist was already registered in the previous step.)
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |item| item.name == 'App' }
          abort('App target not found') unless target

          target.build_configurations.each do |config|
            next unless config.name == 'Release'
            settings = config.build_settings
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
            settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          end

          attributes = project.root_object.attributes['TargetAttributes'] ||= {}
          target_attributes = attributes[target.uuid] ||= {}
          target_attributes['ProvisioningStyle'] = 'Manual'
          target_attributes['DevelopmentTeam'] = ENV.fetch('TEAM_ID')
          project.save
          RUBY

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sommers.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/sommers-signing.keychain-db"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/sommers-output"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sommers.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/sommers-output"

      - name: Verify the archived app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Sommers.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          test -f "$APP/GoogleService-Info.plist" || {
            echo "::error::GoogleService-Info.plist was not bundled — native Google Sign-In would fail."
            exit 1
          }
          test -d "$APP/public/_next"
          # AdMob must not be LINKED into the iOS binary at all. The Google Mobile
          # Ads SDK runs a startup check that kills the app at launch whenever
          # GADApplicationIdentifier is missing from Info.plist — even if JS never
          # calls the plugin. Builds 14-16 shipped exactly that combination (SDK
          # linked, key removed) and crashed on the physical device, because the
          # "remove AdMob from iOS" change only gated the JS calls. The real
          # removal is ios.includePlugins in capacitor.config.json; this gate
          # proves it worked on every build.
          if grep -aq 'GADApplicationIdentifier' "$APP/App"; then
            echo "::error::Google Mobile Ads SDK is still linked into the iOS binary — it will crash the app at launch without GADApplicationIdentifier. Check ios.includePlugins in capacitor.config.json."
            exit 1
          fi
          if grep -q 'AdMobPlugin' "$APP/capacitor.config.json"; then
            echo "::error::AdMobPlugin still appears in the bundled packageClassList — cap sync did not respect ios.includePlugins."
            exit 1
          fi
          # Sign In with Apple always failed on device because no entitlements
          # file existed anywhere in this project (App ID had the capability
          # toggled on in the Apple Developer portal, but the app itself never
          # requested it). Confirm the signed binary actually carries it now.
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'com.apple.developer.applesignin' || {
            echo "::error::com.apple.developer.applesignin entitlement is not present in the signed app — native Sign In with Apple will fail with an authorization error."
            exit 1
          }
          # Google Sign-In's native code must actually be compiled in. Under the
          # old SPM setup the CocoaPods-only google-auth plugin was silently
          # skipped on every build (runtime error: '"GoogleAuth" plugin is not
          # implemented on ios') while the build stayed green. Search the app
          # binary and embedded frameworks for the GoogleSignIn SDK.
          if ! grep -arq 'GIDSignIn' "$APP"; then
            echo "::error::GoogleSignIn native code is absent from the app — Google login would report 'plugin is not implemented on ios'. Did pod install run, and is CodetrixStudioCapacitorGoogleAuth in the Podfile?"
            exit 1
          fi
          # Apple rejected build 22 with ITMS-91061 (missing privacy manifest) for
          # GTMAppAuth, GTMSessionFetcher and GoogleSignIn — CodetrixStudioCapacitorGoogleAuth's
          # podspec was hard-pinned to GoogleSignIn ~> 6.2.4, a 2022-era release that
          # predates Apple's privacy-manifest requirement entirely (the manifest first
          # shipped in GoogleSignIn 7.1.0). Bumped via patches/@codetrix-studio+... to
          # ~> 9.0; this proves the newer frameworks actually carry PrivacyInfo.xcprivacy.
          # CocoaPods ships each manifest inside a generated resource bundle nested in
          # the framework (e.g. GTMSessionFetcher.framework/GTMSessionFetcher_Core_Privacy.bundle/
          # PrivacyInfo.xcprivacy) rather than as a bare file at the framework's root —
          # search recursively instead of assuming one fixed path.
          for fw in GTMAppAuth GTMSessionFetcher GoogleSignIn; do
            if [ -z "$(find "$APP/Frameworks/$fw.framework" -iname 'PrivacyInfo.xcprivacy' -print -quit 2>/dev/null)" ]; then
              echo "::error::$fw.framework has no PrivacyInfo.xcprivacy anywhere under it — Apple will reject with ITMS-91061 again. Check the GoogleSignIn version pin in the patched CodetrixStudioCapacitorGoogleAuth podspec."
              exit 1
            fi
          done
          # Build 25 shipped with DeviceTrialPlugin.swift present in ios/App/App/
          # but absent from the compiled binary, because it was never registered
          # into the Xcode project's Sources build phase (fixed in the previous
          # workflow step). Confirm the class symbol actually made it into the
          # binary this time, not just that the source file exists in the repo.
          if ! grep -aq 'DeviceTrialPlugin' "$APP/App"; then
            echo "::error::DeviceTrialPlugin is not compiled into the app binary — the anonymous-auth free-trial guard is silently inert. Check that App/*.swift files are being added to the Sources build phase."
            exit 1
          fi
          echo "Archive verified: Firebase plist bundled, web assets present, AdMob absent, Apple entitlement signed, GoogleSignIn compiled in, privacy manifests present, DeviceTrialPlugin compiled in."

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sommers-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/sommers-output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        env:
          API_KEY_VALUE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          if printf '%s' "$API_KEY_VALUE" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_VALUE" > "$KEY_PATH"
          else
            printf '%s' "$API_KEY_VALUE" | tr -d '\n\r ' | base64 --decode > "$KEY_PATH"
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP"/sommers-output/*.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

name: iOS Capacitor App Store Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: 🛠️ Xcode IPA Build & App Store Upload
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 💎 Setup CocoaPods & Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🏗️ Build Web Assets & Sync Capacitor iOS
        run: |
          npm run build
          npx cap add ios || true
          npx cap sync ios

      - name: 🔑 Install Apple Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Check if secrets are missing
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then echo "Error: APP_STORE_CERTIFICATE_BASE64 is missing"; exit 1; fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then echo "Error: APP_STORE_PROVISION_PROFILE_BASE64 is missing"; exit 1; fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then echo "Warning: KEYCHAIN_PASSWORD is not set, using default 'temp_pwd'"; KEYCHAIN_PASSWORD="temp_pwd"; fi

          PEM_PATH=$RUNNER_TEMP/unified.pem
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode Unified PEM and Provisioning Profile
          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r\t ' | base64 --decode -o $PEM_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n\r\t ' | base64 --decode -o $PP_PATH

          # Generate the .p12 file natively on the macOS runner to avoid any OpenSSL encryption incompatibilities
          echo "Generating native macOS .p12 from Unified PEM..."
          openssl pkcs12 -export -in $PEM_PATH -out $CERTIFICATE_PATH -password pass:1234

          echo "--- DEBUG INFO ---"
          echo "Unified PEM Size: $(wc -c < $PEM_PATH) bytes"
          echo "Generated P12 Size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "Expected Profile Size: ~12000 bytes"
          echo "Actual Profile Size: $(wc -c < $PP_PATH) bytes"
          echo "------------------"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P 1234 -T /usr/bin/codesign
          security list-keychains -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 🏗️ Archive & Export IPA via xcodebuild
        run: |
          cd ios/App
          pod install

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE="Manual"

          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output

      - name: 🚀 Upload IPA Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: BulletDodge-iOS-v1.0.14
          path: ${{ runner.temp }}/build_output/*.ipa

      - name: 🍏 Upload to TestFlight / App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file ${{ runner.temp }}/build_output/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

name: iOS Capacitor App Store Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍎 Xcode IPA Build & App Store Upload
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 💎 Setup CocoaPods & Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🏗️ Build Web Assets & Sync Capacitor iOS
        run: |
          npm run build
          npx cap add ios || true
          npx cap sync ios

      - name: 🔑 Install Apple Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Check if secrets are missing
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then echo "Error: APP_STORE_CERTIFICATE_BASE64 is missing"; exit 1; fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then echo "Error: APP_STORE_PROVISION_PROFILE_BASE64 is missing"; exit 1; fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then echo "Warning: KEYCHAIN_PASSWORD is not set, using default 'temp_pwd'"; KEYCHAIN_PASSWORD="temp_pwd"; fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Download and import Apple WWDR Certificates to establish trust chain
          curl -s -L -o $RUNNER_TEMP/AppleWWDRCA.cer https://developer.apple.com/certificationauthority/AppleWWDRCA.cer
          curl -s -L -o $RUNNER_TEMP/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -s -L -o $RUNNER_TEMP/AppleWWDRCAG6.cer https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCA.cer -k $KEYCHAIN_PATH -A
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -A
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -A

          # Decode Certificate Secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r\t ' | base64 --decode > $RUNNER_TEMP/raw_cert.file
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n\r\t ' | base64 --decode -o $PP_PATH

          # Determine format and convert to native macOS .p12
          echo "Processing Certificate..."
          if head -n 1 $RUNNER_TEMP/raw_cert.file | grep -q "^-----BEGIN"; then
            echo "Format: PEM. Stripping CRLF and generating macOS native .p12..."
            cat $RUNNER_TEMP/raw_cert.file | tr -d '\r' > $RUNNER_TEMP/clean_cert.pem
            openssl pkcs12 -export -in $RUNNER_TEMP/clean_cert.pem -out $CERTIFICATE_PATH -password pass:1234
          else
            echo "Format: P12. Decrypting and re-encrypting with LibreSSL defaults..."
            
            # Check if openssl supports -legacy (OpenSSL 3.x)
            if openssl pkcs12 -help 2>&1 | grep -q "\-legacy"; then
              LEGACY_FLAG="-legacy"
              echo "Using OpenSSL 3.x with -legacy flag for Apple keychain compatibility"
            else
              LEGACY_FLAG=""
              echo "Using older OpenSSL/LibreSSL, relying on default legacy algorithms"
            fi
            
            if openssl pkcs12 -in $RUNNER_TEMP/raw_cert.file -out $RUNNER_TEMP/converted.pem -nodes -passin pass:1234 2>/dev/null; then
              echo "Successfully decrypted with password '1234'"
              openssl pkcs12 -export -in $RUNNER_TEMP/converted.pem -out $CERTIFICATE_PATH -password pass:1234 $LEGACY_FLAG
            elif openssl pkcs12 -in $RUNNER_TEMP/raw_cert.file -out $RUNNER_TEMP/converted.pem -nodes -passin pass:$P12_PASSWORD 2>/dev/null; then
              echo "Successfully decrypted with P12_PASSWORD env var"
              openssl pkcs12 -export -in $RUNNER_TEMP/converted.pem -out $CERTIFICATE_PATH -password pass:1234 $LEGACY_FLAG
            else
              echo "Failed to decrypt P12 file. Password is wrong or file is corrupt."
              exit 1
            fi
          fi

          echo "--- DEBUG INFO ---"
          echo "Generated P12 Size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "Expected Profile Size: ~12000 bytes"
          echo "Actual Profile Size: $(wc -c < $PP_PATH) bytes"
          echo "------------------"

          # Ensure keychain is unlocked before import
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
          # Import the certificate
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P 1234 -T /usr/bin/codesign -A

          # Set partition list AFTER import to grant codesign tool access without UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

          security list-keychains -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 🔢 Bump Build Number & Target OS
        run: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^\;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [^\;]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj

      - name: 🏗️ Build & Archive App & Export IPA via xcodebuild
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          cd ios/App

          # Disable code signing for CocoaPods targets by replacing the post_install hook
          perl -0777 -pi -e 's/post_install do \|installer\|.*?end/post_install do \|installer\|\n  assertDeploymentTarget(installer)\n  installer.pods_project.targets.each do \|target\|\n    target.build_configurations.each do \|config\|\n      config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""\n      config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"\n      config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n    end\n  end\nend/s' Podfile

          # Apple rejected build 98 with ITMS-91061 (missing privacy manifest) for
          # GTMAppAuth, GTMSessionFetcher and GoogleSignIn — CodetrixStudioCapacitorGoogleAuth's
          # podspec pins GoogleSignIn to a 2022-era 6.2.4 that predates Apple's privacy-manifest
          # requirement (first shipped in GoogleSignIn 7.1.0). Pin to 7.1 specifically rather than
          # the latest major (9.x removed GIDGoogleUser.authentication/.serverAuthCode, which this
          # plugin's Swift code still calls — confirmed by a failed CI run) so pod install pulls
          # frameworks that carry PrivacyInfo.xcprivacy without breaking the plugin's API surface.
          GOOGLE_AUTH_PODSPEC="../../node_modules/@codetrix-studio/capacitor-google-auth/CodetrixStudioCapacitorGoogleAuth.podspec"
          sed -i '' "s/s.dependency 'GoogleSignIn', '~> 6.2.4'/s.dependency 'GoogleSignIn', '~> 7.1'/" "$GOOGLE_AUTH_PODSPEC"
          grep "GoogleSignIn" "$GOOGLE_AUTH_PODSPEC"

          # Podfile.lock still pins the old resolved version — force a fresh resolve
          # against the patched podspec instead of failing on the stale snapshot.
          rm -f Podfile.lock

          pod install --repo-update

          # Extract UUID and Team ID from Provisioning Profile
          security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision > $RUNNER_TEMP/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          echo "Extracted Profile UUID: $PROFILE_UUID"
          echo "Extracted Team ID: $TEAM_ID"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -configuration Release \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.retro.bulletdodge</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output

      - name: 🔒 Verify privacy manifests (ITMS-91061 regression gate)
        run: |
          APP=$(find "${{ runner.temp }}/build_output" -maxdepth 2 -name "*.app" | head -n1)
          echo "Checking $APP"
          for fw in GTMAppAuth GTMSessionFetcher GoogleSignIn; do
            if [ ! -f "$APP/Frameworks/$fw.framework/PrivacyInfo.xcprivacy" ]; then
              echo "::error::$fw.framework has no PrivacyInfo.xcprivacy — Apple will reject with ITMS-91061 again. Check the GoogleSignIn version pin in the patched CodetrixStudioCapacitorGoogleAuth podspec."
              exit 1
            fi
          done
          echo "Privacy manifests present in GTMAppAuth, GTMSessionFetcher, GoogleSignIn."

      - name: 🚀 Upload IPA Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: BulletDodge-iOS-v1.0.14
          path: ${{ runner.temp }}/build_output/*.ipa

      - name: 🍏 Upload to TestFlight / App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if echo "$APP_STORE_CONNECT_API_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "API Key is already raw text, saving directly..."
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          else
            echo "API Key is base64, decoding..."
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\n\r ' | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          fi

          xcrun altool --upload-app \
            --type ios \
            --file ${{ runner.temp }}/build_output/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
